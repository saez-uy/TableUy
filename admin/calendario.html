<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario — Admin TableUy</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="sidebar-logo">TableUy <span>Panel de administración</span></div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Principal</div>
      <a href="index.html"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="calendario.html" class="active"><span class="nav-icon">🗓</span> Calendario</a>
      <div class="sidebar-section-label">Gestión</div>
      <a href="reservas.html"><span class="nav-icon">📋</span> Todas las reservas</a>
      <a href="configuracion.html"><span class="nav-icon">⚙️</span> Configuración</a>
      <div class="sidebar-section-label">Sitio</div>
      <a href="../reservar.html" target="_blank"><span class="nav-icon">🔗</span> Ver formulario</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">Administrador</div>
      <button class="btn btn-ghost btn-sm w-full" id="logout-btn">Cerrar sesión</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:1rem">
        <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <span class="topbar-title">Calendario</span>
      </div>
      <div style="display:flex;align-items:center;gap:.75rem">
        <button id="btn-hoy" class="btn btn-outline btn-sm">Hoy</button>
        <button id="cal-prev" class="btn btn-ghost btn-sm">‹</button>
        <span id="cal-title" style="min-width:180px;text-align:center;font-family:var(--font-serif);font-size:1.1rem"></span>
        <button id="cal-next" class="btn btn-ghost btn-sm">›</button>
        <button id="btn-view-month" class="btn btn-primary btn-sm">Mes</button>
        <button id="btn-view-day" class="btn btn-outline btn-sm">Día</button>
      </div>
    </div>

    <div class="admin-content">
      <div id="admin-error" class="alert alert-error hidden mb-3"></div>

      <div id="cal-loading" class="text-center" style="padding:3rem">
        <span class="spinner" style="width:36px;height:36px;border-width:3px"></span>
      </div>

      <div id="cal-content" class="hidden">
        <!-- Renderizado por calendario.js -->
      </div>
    </div>
  </main>

</div>

<!-- MODAL: Detalle reserva desde calendario -->
<div class="modal-overlay" id="modal-reserva-cal">
  <div class="modal">
    <div class="modal-header">
      <h3>Reserva</h3>
      <button class="modal-close" onclick="closeModal('modal-reserva-cal')">×</button>
    </div>
    <div id="modal-cal-content"></div>
  </div>
</div>

<!-- MODAL: Nueva reserva desde calendario -->
<div class="modal-overlay" id="modal-nueva-reserva-cal">
  <div class="modal">
    <div class="modal-header">
      <h3>Nueva reserva</h3>
      <button class="modal-close" onclick="closeModal('modal-nueva-reserva-cal')">×</button>
    </div>
    <form id="form-nueva-reserva-cal">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Fecha *</label>
          <input type="date" name="fecha" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Hora *</label>
          <input type="time" name="hora" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Personas *</label>
          <input type="number" name="personas" class="form-control" min="1" max="20" value="2" required>
        </div>
        <div class="form-group">
          <label class="form-label">Nombre *</label>
          <input type="text" name="nombre" class="form-control" required>
        </div>
        <div class="form-group full-width">
          <label class="form-label">Email *</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Teléfono</label>
          <input type="tel" name="telefono" class="form-control">
        </div>
        <div class="form-group full-width">
          <label class="form-label">Notas</label>
          <textarea name="notas" class="form-control" rows="2"></textarea>
        </div>
      </div>
      <div class="flex justify-between mt-3 gap-2">
        <button type="button" class="btn btn-ghost" onclick="closeModal('modal-nueva-reserva-cal')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Crear reserva</button>
      </div>
    </form>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/admin.js"></script>
<script src="../assets/js/calendario.js"></script>
<script>
  // Mostrar contenido cuando carga
  document.addEventListener('DOMContentLoaded', () => {
    const calContent = document.getElementById('cal-content');
    const calLoading = document.getElementById('cal-loading');
    const observer = new MutationObserver(() => {
      if (!calContent.classList.contains('hidden')) observer.disconnect();
    });

    setTimeout(() => {
      calLoading.classList.add('hidden');
      calContent.classList.remove('hidden');
    }, 300);
  });
</script>

</body>
</html>
